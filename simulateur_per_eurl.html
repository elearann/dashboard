<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulateur PER / Rémunération EURL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #fafafa; --surface: #ffffff; --group-bg: #fcfcfb;
    --line: #e4e4e1; --line-soft: #eeeeec;
    --ink: #1c1d1b; --ink-soft: #6b6c68; --ink-faint: #9b9c97;
    --accent: #2f5d54; --accent-soft: #e4ede9;
    --amber: #b8862f; --amber-soft: #f6ecd9;
    --danger: #a34a3a; --danger-soft: #f3e4e1;
  }
  *{box-sizing:border-box;}
  html,body{max-width:100%;overflow-x:hidden;}
  body{ margin:0; background: var(--bg); color: var(--ink); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  button{ font-family:'Inter',sans-serif; font-size:0.82rem; font-weight:500; background: var(--accent); color:#fff; border:none; padding:9px 16px; cursor:pointer; border-radius:6px; }
  button.secondary{ background: transparent; color: var(--ink-soft); border:1px solid var(--line); }
  button.secondary:hover{ background: var(--line-soft); }
  button:hover{ opacity:0.92; } button:disabled{ opacity:0.5; cursor:default; }
  input[type="number"], input[type="text"]{ font-family:'Inter',sans-serif; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background: var(--surface); color: var(--ink); width:100%; }
  input.input-alert{ border-color: var(--danger); background: var(--danger-soft); }

  #auth-bar{ display:flex; justify-content:center; padding:16px; gap:10px; }
  #status-line{ text-align:center; font-size:0.78rem; color: var(--ink-faint); min-height:18px; padding-bottom:6px; }
  #status-line.error{ color: var(--danger); }
  #global-saved{ position:fixed; bottom:20px; right:20px; background: var(--accent); color:#fff; font-size:0.8rem; padding:9px 16px; border-radius:8px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:80; box-shadow:0 4px 14px rgba(0,0,0,0.15); }
  #global-saved.show{ opacity:1; } #global-saved.err{ background: var(--danger); }

  header{ padding: 26px 24px 0; text-align:center; }
  header h1{ font-family:'Fraunces', serif; font-weight:600; font-size:1.5rem; margin:0 0 16px; letter-spacing:-0.01em; }

  .shell{ max-width:1400px; margin:0 auto; padding:24px 24px 60px; }
  .toolbar{ display:flex; justify-content:flex-end; gap:8px; padding-bottom:14px; }

  #empty-state{ text-align:center; color: var(--ink-faint); font-size:0.85rem; padding:40px 20px; }

  /* ---- Tableau comparatif ---- */
  .compare-scroll{ overflow-x:auto; background: var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:0 1px 2px rgba(28,29,27,0.03); }
  table.compare-table{ border-collapse:collapse; table-layout:fixed; width:100%; }
  table.compare-table th, table.compare-table td{ padding:9px 14px; border-bottom:1px solid var(--line-soft); font-size:0.86rem; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; position:relative; }
  table.compare-table thead th{ border-bottom:1px solid var(--line); vertical-align:top; padding-top:12px; padding-bottom:12px; background:#fcfcfb; }

  .row-label-col{ text-align:left !important; font-size:0.78rem; color: var(--ink-soft); position:sticky; left:0; background: var(--surface); z-index:2; border-right:1px solid var(--line); white-space:normal !important; }
  thead .row-label-col{ background:#fcfcfb; }

  .section-row td{ padding-top:16px; padding-bottom:4px; border-bottom:none; }
  .section-label{ font-family:'Fraunces', serif; font-weight:600; font-size:0.78rem; color: var(--accent); text-transform:uppercase; letter-spacing:0.04em; }

  .scn-head{ display:flex; align-items:center; gap:4px; }
  .scn-name{ font-family:'Fraunces', serif; font-weight:600; font-size:0.92rem; text-align:left; border:1px solid transparent; padding:2px 4px; min-width:0; }
  .scn-name:hover, .scn-name:focus{ border-color: var(--line); background: var(--surface); }
  .scn-year{ margin-top:4px; font-size:0.74rem; color: var(--ink-soft); text-align:left; width:64px; padding:2px 4px; }
  .btn-icon{ background:transparent; color: var(--ink-faint); padding:2px 5px; font-size:0.82rem; border-radius:4px; flex-shrink:0; line-height:1; }
  .btn-icon:hover{ opacity:1; }
  .btn-delete:hover{ background: var(--danger-soft); color: var(--danger); }
  .btn-dup:hover{ background: var(--accent-soft); color: var(--accent); }
  .col-error{ font-size:0.66rem; color: var(--danger); text-align:left; white-space:normal; margin-top:4px; }

  .cell-input{ text-align:right; }
  .computed-cell{ color: var(--ink); }
  .suffix{ font-size:0.72rem; color: var(--ink-faint); font-weight:400; }

  .highlight-row td{ background: var(--accent-soft); font-weight:600; }
  .highlight-row .row-label-col{ background: var(--accent-soft); }
  .big-cell{ font-family:'Fraunces', serif; font-size:1.1rem; color: var(--accent); }

  /* Poignée de redimensionnement de colonne */
  .resizer{ position:absolute; top:0; right:0; width:6px; height:100%; cursor:col-resize; user-select:none; z-index:3; }
  .resizer:hover{ background: var(--accent-soft); }
</style>
</head>
<body>

<div id="auth-bar">
  <button id="btn-signin">Se connecter avec Google</button>
</div>
<div id="status-line"></div>

<header id="app-header" style="display:none;">
  <h1>Simulateur PER / Rémunération — EURL</h1>
</header>

<div class="shell" id="shell" style="display:none;">
  <div class="toolbar">
    <button class="secondary" id="btn-refresh">↻ Rafraîchir</button>
    <button id="btn-add-scenario">+ Nouveau scénario</button>
  </div>
  <div id="scenarios-wrap"></div>
</div>

<div id="global-saved"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ===================== MOTEUR DE CALCUL v2 ===================== */
/* Correction : l'input du scénario est la rémunération NETTE visée (avant IR, PER 154 bis
   inclus dedans puisque prélevé sur cette même enveloppe). La rémunération BRUTE est retrouvée
   par résolution itérative (bissection), car l'assiette de cotisations dépend du brut. */

// Calcule les cotisations sociales TNS pour un brut donné (fonction pure, réutilisée par la
// résolution itérative et par le résultat final une fois le brut trouvé).
function cotisationsSocialesTNS(remBrute, dividendes, params) {
  const PASS = params.pass;
  const revenuBrutAssiette = remBrute + dividendes; // dividendes = hypothèse part >10% capital, cf Notion §11
  const abattementBrut = revenuBrutAssiette * params.abattementAssiette;
  const abattementPlancher = 0.0176 * PASS;
  const abattementPlafond = 1.30 * PASS;
  const abattement = Math.min(Math.max(abattementBrut, abattementPlancher), abattementPlafond);
  const assietteSociale = Math.max(revenuBrutAssiette - abattement, 0);

  function tranche(base, mult, plafondBas, plafondHaut, taux) {
    const bas = plafondBas * mult, haut = (plafondHaut === Infinity ? Infinity : plafondHaut * mult);
    const assietteTranche = Math.min(Math.max(base, bas), haut) - bas;
    return Math.max(assietteTranche, 0) * taux;
  }

  const retraiteBase =
    Math.min(assietteSociale, PASS) * params.retraiteBaseT1 +
    Math.max(assietteSociale - PASS, 0) * params.retraiteBaseT2;

  const retraiteCompl =
    Math.min(assietteSociale, PASS) * params.retraiteComplT1 +
    (Math.min(assietteSociale, 4 * PASS) - Math.min(assietteSociale, PASS)) * params.retraiteComplT2;

  const maladieTranches = [
    [0, 0.20, params.maladieT1], [0.20, 0.40, params.maladieT2], [0.40, 0.60, params.maladieT3],
    [0.60, 1.10, params.maladieT4], [1.10, 2.00, params.maladieT5], [2.00, 3.00, params.maladieT6],
  ];
  let maladie = 0;
  maladieTranches.forEach(([lo, hi, taux]) => { maladie += tranche(assietteSociale, PASS, lo, hi, taux); });

  const IJ = Math.min(assietteSociale, 5 * PASS) * params.ijMaladie;
  const invaliditeDeces = Math.min(assietteSociale, PASS) * params.invaliditeDeces;
  const allocFamiliales = tranche(assietteSociale, PASS, 1.10, 1.40, params.allocFamiliales);
  const CSGCRDSDeductible = assietteSociale * params.csgDeductible;
  const CSGCRDSNonDeductible = assietteSociale * params.csgNonDeductible;

  const total = retraiteBase + retraiteCompl + maladie + IJ + invaliditeDeces + allocFamiliales
              + CSGCRDSDeductible + CSGCRDSNonDeductible;

  return { total, assietteSociale, retraiteBase, retraiteCompl, maladie, IJ, invaliditeDeces,
           allocFamiliales, CSGCRDSDeductible, CSGCRDSNonDeductible };
}

// Résout le brut tel que : brut - cotisations(brut) = netteVisee
// La fonction (brut -> net) est strictement croissante -> bissection simple, sûre et suffisante
// (pas besoin de Newton, l'écart de précision visé est de l'ordre du centime sur quelques €).
function resoudreBrutDepuisNette(netteVisee, dividendes, params) {
  let lo = netteVisee, hi = netteVisee * 1.8; // le brut est toujours > net, 1.8x est une marge large
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    const cot = cotisationsSocialesTNS(mid, dividendes, params);
    const netteObtenue = mid - cot.total;
    if (netteObtenue < netteVisee) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

// scn: { CA, charges, remNette, per154, per163, dividendes }
function calculerScenario(scn, params, bareme) {
  const PASS = params.pass;

  // ---- 1. Résolution brut <- nette ----
  const remBrute = resoudreBrutDepuisNette(scn.remNette, scn.dividendes, params);
  const cot = cotisationsSocialesTNS(remBrute, scn.dividendes, params);
  const remNette = remBrute - cot.total; // recalculée, doit coller à scn.remNette à l'arrondi près

  // ---- 2. Société ----
  const resultatAvantIS = scn.CA - scn.charges - remBrute - scn.per154;
  const isReduit = Math.min(Math.max(resultatAvantIS, 0), params.seuilISReduit) * params.tauxISReduit;
  const isNormal = Math.max(resultatAvantIS - params.seuilISReduit, 0) * params.tauxISNormal;
  const IS = isReduit + isNormal;
  const beneficeNet = resultatAvantIS - IS;

  // ---- 3. 1GB ----
  const un_GB = remNette + cot.CSGCRDSNonDeductible; // prévoyance non-déductible non modélisée (pas de champ dédié)

  // ---- 4. Plafonds 154 bis (calcul auto, répartition strate 15 puis 10) ----
  const plafond154_15 = Math.max(0.15 * (remBrute - PASS), 0);
  const plafond154_10 = 0.10 * remBrute;
  const strate15Utilisee = Math.min(scn.per154, plafond154_15);
  const strate10Utilisee = Math.min(Math.max(scn.per154 - strate15Utilisee, 0), plafond154_10);
  const per154Depasse = scn.per154 > (plafond154_15 + plafond154_10);

  // ---- 5. Revenu imposable + IR ----
  const revenuImposable = Math.max((un_GB - scn.per154) * 0.90 - scn.per163, 0);
  let IR = 0;
  bareme.forEach(t => {
    const haut = (t.borneHaute === null || t.borneHaute === undefined) ? Infinity : t.borneHaute;
    const assietteTranche = Math.min(revenuImposable, haut) - t.borneBasse;
    if (assietteTranche > 0) IR += assietteTranche * t.taux;
  });

  // ---- 6. Résultats finaux ----
  // Cash en poche = nette - 154bis (déjà sorti via société) - 163 (viré perso) - IR
  // Mais remNette telle que définie ici est déjà nette de cotisations ET inclut le 154bis
  // (puisque brut a été résolu pour donner cette nette-là, 154bis compris dedans).
  // Donc : cash réellement disponible après PER = remNette - scn.per154 - scn.per163
  const cashApresPER = remNette - scn.per154 - scn.per163;
  const revenuNetEnPoche = cashApresPER - IR;
  const totalPrelevements = cot.total + IS + IR;
  const tauxPrelevementGlobal = scn.CA > 0 ? totalPrelevements / scn.CA : 0;

  return {
    remBrute, remNette,
    resultatAvantIS, IS, beneficeNet,
    ...cot,
    un_GB,
    plafond154_15, plafond154_10, strate15Utilisee, strate10Utilisee, per154Depasse,
    revenuImposable, IR,
    cashApresPER, revenuNetEnPoche, totalPrelevements, tauxPrelevementGlobal,
  };
}

/* ===================== CONFIGURATION ===================== */
const CLIENT_ID = "815063719481-1e32pi1caur7pv175qivvrlcddpfr6vs.apps.googleusercontent.com";
const SPREADSHEET_ID = "1Wxr-2U5Uc98puzvVo5Q9N9O92gPTGYVNFDme44EeW0w";
/* ============================================================ */

const SCOPES = "https://www.googleapis.com/auth/spreadsheets";
let tokenClient, accessToken = null, tokenExpiresAt = 0;

// Structure des 3 onglets : header en row 5 (row 4 pour Barème IR), data à partir de la ligne suivante.
const SHEETS = {
  scenarios: { name: "Scénarios",           headerRow: 5, width: 11 }, // A:K
  params:    { name: "Paramètres annuels",  headerRow: 5, width: 22 }, // A:V
  bareme:    { name: "Barème IR",           headerRow: 4, width: 4  }, // A:D
};

let DATA = { scenarios: [], params: [], bareme: [] };
let SHEET_IDS = {};

const els = {
  signin: document.getElementById('btn-signin'),
  status: document.getElementById('status-line'),
  header: document.getElementById('app-header'),
  shell: document.getElementById('shell'),
  globalSaved: document.getElementById('global-saved'),
};

function setStatus(msg, isError){
  els.status.textContent = msg || "";
  els.status.classList.toggle('error', !!isError);
}
function showSaved(msg, isErr){
  els.globalSaved.textContent = msg || (isErr ? '✕ échec' : '✓ enregistré');
  els.globalSaved.classList.toggle('err', !!isErr);
  els.globalSaved.classList.add('show');
  clearTimeout(showSaved._t);
  showSaved._t = setTimeout(()=> els.globalSaved.classList.remove('show'), 1800);
}

window.addEventListener('load', () => {
  if(window.google){
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPES, callback: () => {}
    });
  }
});

function requestToken(prompt){
  return new Promise((resolve, reject) => {
    if(!tokenClient){ reject(new Error('Client OAuth non initialisé.')); return; }
    tokenClient.callback = (resp) => {
      if(resp.error){ reject(new Error(resp.error)); return; }
      accessToken = resp.access_token;
      tokenExpiresAt = Date.now() + ((resp.expires_in || 3600) * 1000) - 60000;
      resolve(accessToken);
    };
    tokenClient.requestAccessToken({ prompt });
  });
}

els.signin.addEventListener('click', async () => {
  try{ await requestToken('consent'); onSignedIn(); }
  catch(e){ setStatus("Connexion refusée.", true); }
});

function onSignedIn(){
  document.getElementById('auth-bar').style.display = "none";
  els.header.style.display = "block";
  els.shell.style.display = "block";
  loadAll();
}

async function ensureFreshToken(){
  if(!accessToken || Date.now() >= tokenExpiresAt){
    try{ await requestToken(''); }
    catch(e){
      document.getElementById('auth-bar').style.display = 'flex';
      els.header.style.display = "none";
      els.shell.style.display = "none";
      throw new Error('Session Google expirée, reconnecte-toi.');
    }
  }
}

async function apiFetch(url, options={}, _retried=false){
  await ensureFreshToken();
  const res = await fetch(url, { ...options, headers: { ...(options.headers||{}), Authorization: `Bearer ${accessToken}` } });
  if(res.status === 401 && !_retried){ await requestToken(''); return apiFetch(url, options, true); }
  if(!res.ok){ const t = await res.text(); throw new Error(`API ${res.status}: ${t}`); }
  return res.json();
}

function colLetter(n){
  let s = "", i = n + 1;
  while(i > 0){ const m = (i - 1) % 26; s = String.fromCharCode(65+m) + s; i = Math.floor((i-1)/26); }
  return s;
}

/* ===================== LOAD ===================== */
async function loadAll(){
  setStatus("Chargement...");
  try{
    if(Object.keys(SHEET_IDS).length === 0){
      const metaUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}?fields=sheets.properties(sheetId,title)`;
      const meta = await apiFetch(metaUrl);
      const byTitle = {};
      (meta.sheets || []).forEach(s => { byTitle[s.properties.title] = s.properties.sheetId; });
      Object.entries(SHEETS).forEach(([k, s]) => { if(byTitle[s.name] !== undefined) SHEET_IDS[k] = byTitle[s.name]; });
    }
    const keys = Object.keys(SHEETS);
    const ranges = keys.map(k => {
      const s = SHEETS[k];
      return `${s.name}!A${s.headerRow+1}:${colLetter(s.width-1)}`;
    });
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values:batchGet?` +
      ranges.map(r => `ranges=${encodeURIComponent(r)}`).join('&');
    const data = await apiFetch(url);
    const vr = data.valueRanges || [];
    keys.forEach((k, idx) => {
      const values = (vr[idx] && vr[idx].values) || [];
      const startRow = SHEETS[k].headerRow + 1;
      DATA[k] = values
        .map((r, i) => ({ rowIndex: startRow + i, cells: r }))
        .filter(r => r.cells.some(c => c !== undefined && c !== "")); // ignore lignes vides
    });
    setStatus("");
    parseParamsAndBareme();
    renderAll();
  }catch(e){
    setStatus("Erreur de chargement : " + e.message + " — vérifie que les onglets Scénarios / Paramètres annuels / Barème IR existent bien.", true);
  }
}

function cell(row, idx){ return (row.cells[idx] !== undefined && row.cells[idx] !== null) ? row.cells[idx] : ""; }
function num(row, idx){
  const raw = String(cell(row, idx)).replace(/\s/g,'').replace('%','').replace(',', '.');
  const v = parseFloat(raw);
  if(isNaN(v)) return 0;
  return raw.includes('%') || String(cell(row,idx)).includes('%') ? v/100 : v;
}
function pct(row, idx){
  const raw = cell(row, idx);
  const v = parseFloat(String(raw).replace(',', '.').replace('%',''));
  return isNaN(v) ? 0 : v/100;
}

// Onglet Paramètres annuels -> { [année]: { pass, seuilISReduit, ... } }
// Onglet Barème IR -> { [année]: [ {borneBasse, borneHaute, taux}, ... ] }
let PARAMS_BY_YEAR = {};
let BAREME_BY_YEAR = {};

function parseParamsAndBareme(){
  PARAMS_BY_YEAR = {};
  DATA.params.forEach(r => {
    const annee = parseInt(cell(r,0), 10);
    if(!annee) return;
    PARAMS_BY_YEAR[annee] = {
      pass: num(r,1), seuilISReduit: num(r,2), tauxISReduit: pct(r,3), tauxISNormal: pct(r,4),
      retraiteBaseT1: pct(r,5), retraiteBaseT2: pct(r,6),
      retraiteComplT1: pct(r,7), retraiteComplT2: pct(r,8),
      maladieT1: pct(r,9), maladieT2: pct(r,10), maladieT3: pct(r,11),
      maladieT4: pct(r,12), maladieT5: pct(r,13), maladieT6: pct(r,14),
      ijMaladie: pct(r,15), invaliditeDeces: pct(r,16), allocFamiliales: pct(r,17),
      csgDeductible: pct(r,18), csgNonDeductible: pct(r,19),
      abattementAssiette: pct(r,20), seuilTMI41: num(r,21),
    };
  });

  BAREME_BY_YEAR = {};
  DATA.bareme.forEach(r => {
    const annee = parseInt(cell(r,0), 10);
    if(!annee) return;
    if(!BAREME_BY_YEAR[annee]) BAREME_BY_YEAR[annee] = [];
    const borneHauteRaw = cell(r,2);
    BAREME_BY_YEAR[annee].push({
      borneBasse: num(r,1),
      borneHaute: borneHauteRaw === "" ? null : num(r,2),
      taux: pct(r,3),
    });
  });
}

/* ===================== RENDER v3 ===================== */

function scenarioFromRow(r){
  return {
    rowIndex: r.rowIndex,
    id: cell(r,0), nom: cell(r,1), ordre: num(r,2), annee: parseInt(cell(r,3),10) || 0,
    CA: num(r,4), charges: num(r,5), remNette: num(r,6),
    per154: num(r,7), per163: num(r,8), dividendes: num(r,9), notes: cell(r,10),
  };
}

function fmtEuro(v){ return Math.round(v).toLocaleString('fr-FR') + ' €'; }
function fmtPct(v){ return (v*100).toLocaleString('fr-FR', {maximumFractionDigits:1}) + ' %'; }

// Lignes calculées (lecture seule) — chaque entrée a une clé unique servant à cibler la cellule
// à mettre à jour en live, sans reconstruire tout le tableau.
const COMPUTED_ROWS = [
  { section: 'Société' },
  { metric:'remBrute', label:'Rémunération brute retrouvée' },
  { metric:'IS', label:'IS' },
  { metric:'beneficeNet', label:'Trésorerie restante (bénéfice net)' },
  { section: 'Cotisations & 1GB' },
  { metric:'cotisTotal', label:'Cotisations sociales' },
  { metric:'un_GB', label:'1GB' },
  { section: 'Plafonds PER' },
  { metric:'strate15', label:'154 bis — strate 15% utilisée' },
  { metric:'strate10', label:'154 bis — strate 10% utilisée' },
  { metric:'depasse154', label:'Plafond 154 bis dépassé ?', raw:true },
  { section: 'Fiscal' },
  { metric:'revenuImposable', label:'Revenu imposable' },
  { metric:'IR', label:'IR' },
  { section: 'Résultat', highlight:true },
  { metric:'revenuNetEnPoche', label:'Revenu net en poche', big:true },
  { metric:'totalPrelevements', label:'Total cotisations + IS + IR' },
  { metric:'tauxGlobal', label:'Taux de prélèvement global (/CA)', isPct:true },
];

const INPUT_ROWS = [
  { key:'CA', label:'CA', col:4 },
  { key:'charges', label:'Charges', col:5 },
  { key:'remNette', label:'Rémunération nette visée', col:6 },
  { key:'per154', label:'154 bis versé', col:7 },
  { key:'per163', label:'163 versé', col:8 },
  { key:'dividendes', label:'Dividendes', col:9 },
];

let SCENARIOS_CACHE = []; // dernière liste de scénarios rendue, pour recalcul live sans re-render complet

function computeMetrics(r){
  if(!r) return null;
  return {
    remBrute: r.remBrute, IS: r.IS, beneficeNet: r.beneficeNet,
    cotisTotal: r.total, un_GB: r.un_GB,
    strate15: fmtEuro(r.strate15Utilisee) + ' <span class="suffix">/ ' + fmtEuro(r.plafond154_15) + '</span>',
    strate10: fmtEuro(r.strate10Utilisee) + ' <span class="suffix">/ ' + fmtEuro(r.plafond154_10) + '</span>',
    depasse154: r.per154Depasse ? '⚠️ dépassement' : '—',
    revenuImposable: r.revenuImposable, IR: r.IR,
    revenuNetEnPoche: r.revenuNetEnPoche, totalPrelevements: r.totalPrelevements,
    tauxGlobal: fmtPct(r.tauxPrelevementGlobal),
  };
}

function calcScenarioSafe(scn){
  const params = PARAMS_BY_YEAR[scn.annee];
  const bareme = BAREME_BY_YEAR[scn.annee];
  if(!params || !bareme) return { error: `Paramètres/barème manquants pour ${scn.annee}` };
  try{ return { r: calculerScenario(scn, params, bareme) }; }
  catch(e){ return { error: e.message }; }
}

function renderAll(){
  SCENARIOS_CACHE = DATA.scenarios.map(scenarioFromRow).sort((a,b) => a.ordre - b.ordre);
  const wrap = document.getElementById('scenarios-wrap');

  if(SCENARIOS_CACHE.length === 0){
    wrap.innerHTML = '<div id="empty-state">Aucun scénario. Clique sur "+ Nouveau scénario" pour commencer.</div>';
    return;
  }

  const widths = loadWidths();

  let html = '<div class="compare-scroll"><table class="compare-table" id="compare-table">';
  html += '<colgroup><col style="width:' + (widths.rowLabel||230) + 'px">';
  SCENARIOS_CACHE.forEach(scn => { html += '<col style="width:' + (widths.scenarios[scn.id]||190) + 'px">'; });
  html += '</colgroup><thead><tr><th class="row-label-col"><div class="resizer" data-target="rowLabel"></div></th>';

  SCENARIOS_CACHE.forEach(scn => {
    html += `<th class="scn-col">
      <div class="scn-head">
        <input class="scn-name" data-row="${scn.rowIndex}" data-col="1" value="${escapeAttr(scn.nom)}">
        <button class="btn-icon btn-dup" data-row="${scn.rowIndex}" title="Dupliquer">⧉</button>
        <button class="btn-icon btn-delete" data-row="${scn.rowIndex}" title="Supprimer">✕</button>
      </div>
      <input class="scn-year" type="number" data-row="${scn.rowIndex}" data-col="3" value="${scn.annee}">
      <div class="col-error" id="col-error-${scn.rowIndex}"></div>
      <div class="resizer" data-target="${scn.id}"></div>
    </th>`;
  });
  html += '</tr></thead><tbody>';

  html += '<tr class="section-row"><td class="row-label-col section-label">Hypothèses</td>';
  SCENARIOS_CACHE.forEach(()=> html += '<td></td>');
  html += '</tr>';

  INPUT_ROWS.forEach(def => {
    html += `<tr><td class="row-label-col">${def.label}</td>`;
    SCENARIOS_CACHE.forEach(scn => {
      html += `<td><input class="cell-input" type="number" step="1" data-row="${scn.rowIndex}" data-col="${def.col}" data-key="${def.key}" value="${scn[def.key]}"></td>`;
    });
    html += '</tr>';
  });

  COMPUTED_ROWS.forEach(def => {
    if(def.section){
      html += `<tr class="section-row"><td class="row-label-col section-label">${def.section}</td>`;
      SCENARIOS_CACHE.forEach(()=> html += '<td></td>');
      html += '</tr>';
      return;
    }
    html += `<tr class="${def.highlight?'highlight-row':''}"><td class="row-label-col">${def.label}</td>`;
    SCENARIOS_CACHE.forEach(scn => {
      html += `<td class="computed-cell ${def.big?'big-cell':''}" data-row="${scn.rowIndex}" data-metric="${def.metric}">…</td>`;
    });
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  wrap.innerHTML = html;

  wrap.querySelectorAll('input.cell-input').forEach(inp => {
    inp.addEventListener('input', onInputLive);
    inp.addEventListener('change', onFieldPersist);
  });
  wrap.querySelectorAll('input.scn-name, input.scn-year').forEach(inp => inp.addEventListener('change', onFieldPersist));
  wrap.querySelectorAll('button.btn-delete').forEach(btn => btn.addEventListener('click', onDeleteScenario));
  wrap.querySelectorAll('button.btn-dup').forEach(btn => btn.addEventListener('click', onDuplicateScenario));
  wrap.querySelectorAll('.resizer').forEach(r => r.addEventListener('mousedown', onResizeStart));

  SCENARIOS_CACHE.forEach(scn => recomputeAndPaint(scn.rowIndex));
}

// Recalcule un seul scénario à partir de SCENARIOS_CACHE (déjà à jour en mémoire) et peint
// uniquement ses cellules calculées + l'état d'alerte — les <input> ne sont jamais touchés.
function recomputeAndPaint(rowIndex){
  const scn = SCENARIOS_CACHE.find(s => s.rowIndex === rowIndex);
  if(!scn) return;
  const { r, error } = calcScenarioSafe(scn);
  const errBox = document.getElementById('col-error-' + rowIndex);
  if(errBox) errBox.textContent = error ? '⚠️ ' + error : '';

  const metrics = computeMetrics(r);
  document.querySelectorAll(`.computed-cell[data-row="${rowIndex}"]`).forEach(td => {
    const key = td.dataset.metric;
    if(!metrics){ td.innerHTML = '—'; return; }
    let val = metrics[key];
    if(typeof val === 'number') val = fmtEuro(val);
    td.innerHTML = val;
  });

  // Alerte visuelle directement sur le champ 154 bis si dépassement
  const per154Input = document.querySelector(`input.cell-input[data-row="${rowIndex}"][data-key="per154"]`);
  if(per154Input) per154Input.classList.toggle('input-alert', !!(r && r.per154Depasse));
}

function onInputLive(e){
  const rowIndex = parseInt(e.target.dataset.row, 10);
  const key = e.target.dataset.key;
  const value = e.target.value === '' ? 0 : parseFloat(e.target.value);
  const scn = SCENARIOS_CACHE.find(s => s.rowIndex === rowIndex);
  if(scn) scn[key] = isNaN(value) ? 0 : value;
  recomputeAndPaint(rowIndex);
}

function escapeAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

async function onFieldPersist(e){
  const rowIndex = parseInt(e.target.dataset.row, 10);
  const colIdx = parseInt(e.target.dataset.col, 10);
  const isText = e.target.classList.contains('scn-name');
  const value = isText ? e.target.value : (e.target.value === '' ? 0 : parseFloat(e.target.value));

  const row = DATA.scenarios.find(r => r.rowIndex === rowIndex);
  if(row){ row.cells[colIdx] = String(value); }

  const range = `${SHEETS.scenarios.name}!${colLetter(colIdx)}${rowIndex}`;
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}?valueInputOption=USER_ENTERED`;
  try{
    await apiFetch(url, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ range, values: [[value]] }) });
    showSaved();
  }catch(err){ showSaved("✕ échec : " + err.message, true); }
}

async function onDeleteScenario(e){
  const rowIndex = parseInt(e.target.dataset.row, 10);
  const row = DATA.scenarios.find(r => r.rowIndex === rowIndex);
  const nom = row ? cell(row,1) : rowIndex;
  if(!confirm(`Supprimer le scénario "${nom}" ? Cette action est irréversible.`)) return;

  const sheetId = SHEET_IDS.scenarios;
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}:batchUpdate`;
  const body = { requests: [{ deleteDimension: { range: { sheetId, dimension: 'ROWS', startIndex: rowIndex - 1, endIndex: rowIndex } } }] };
  try{
    await apiFetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    showSaved();
    await loadAll();
  }catch(err){ showSaved("✕ échec suppression : " + err.message, true); }
}

async function onDuplicateScenario(e){
  const rowIndex = parseInt(e.target.dataset.row, 10);
  const scn = SCENARIOS_CACHE.find(s => s.rowIndex === rowIndex);
  if(!scn) return;
  const nouvelId = 'scn_' + Date.now().toString(36);
  const values = [[nouvelId, scn.nom + ' (copie)', SCENARIOS_CACHE.length + 1, scn.annee,
                   scn.CA, scn.charges, scn.remNette, scn.per154, scn.per163, scn.dividendes, scn.notes || '']];
  const range = `${SHEETS.scenarios.name}!A:${colLetter(SHEETS.scenarios.width-1)}`;
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`;
  try{
    await apiFetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ values }) });
    showSaved();
    await loadAll();
  }catch(err){ showSaved("✕ échec duplication : " + err.message, true); }
}

document.getElementById('btn-refresh').addEventListener('click', async () => {
  const btn = document.getElementById('btn-refresh');
  btn.disabled = true; btn.style.opacity = '0.5';
  try{ await loadAll(); } finally { btn.disabled = false; btn.style.opacity = ''; }
});

document.getElementById('btn-add-scenario').addEventListener('click', async () => {
  const nom = prompt('Nom du scénario ?', 'Nouveau scénario');
  if(nom === null) return;
  const anneeParDefaut = new Date().getFullYear();
  const nouvelId = 'scn_' + Date.now().toString(36);
  const ordre = DATA.scenarios.length + 1;
  const values = [[nouvelId, nom || 'Nouveau scénario', ordre, anneeParDefaut, 0, 0, 0, 0, 0, 0, '']];
  const range = `${SHEETS.scenarios.name}!A:${colLetter(SHEETS.scenarios.width-1)}`;
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`;
  try{
    await apiFetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ values }) });
    showSaved();
    await loadAll();
  }catch(err){ showSaved("✕ échec : " + err.message, true); }
});

/* ===================== Colonnes redimensionnables (localStorage) ===================== */
const WIDTHS_KEY = 'simu_per_col_widths';
function loadWidths(){
  try{ return JSON.parse(localStorage.getItem(WIDTHS_KEY)) || { rowLabel:230, scenarios:{} }; }
  catch(e){ return { rowLabel:230, scenarios:{} }; }
}
function saveWidths(w){ localStorage.setItem(WIDTHS_KEY, JSON.stringify(w)); }

let resizeState = null;
function onResizeStart(e){
  const target = e.target.dataset.target;
  const table = document.getElementById('compare-table');
  const colIndex = target === 'rowLabel' ? 0 : Array.from(table.querySelectorAll('col')).findIndex((c,i) => i>0 && SCENARIOS_CACHE[i-1] && SCENARIOS_CACHE[i-1].id === target);
  const col = table.querySelectorAll('col')[colIndex];
  resizeState = { target, col, startX: e.clientX, startWidth: col.getBoundingClientRect().width };
  document.addEventListener('mousemove', onResizeMove);
  document.addEventListener('mouseup', onResizeEnd);
  e.preventDefault();
}
function onResizeMove(e){
  if(!resizeState) return;
  const delta = e.clientX - resizeState.startX;
  const newWidth = Math.max(90, resizeState.startWidth + delta);
  resizeState.col.style.width = newWidth + 'px';
}
function onResizeEnd(){
  if(!resizeState) return;
  const widths = loadWidths();
  const w = parseInt(resizeState.col.style.width, 10);
  if(resizeState.target === 'rowLabel') widths.rowLabel = w;
  else widths.scenarios[resizeState.target] = w;
  saveWidths(widths);
  document.removeEventListener('mousemove', onResizeMove);
  document.removeEventListener('mouseup', onResizeEnd);
  resizeState = null;
}

</script>
